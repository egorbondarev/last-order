name: workshop-index

# Мастерская игры читает один файл — workshop/index.json. Он собирается
# из workshop/maps/*.json этим воркфлоу: положил карту в папку (или залил
# через «Отправить в GitHub» из редактора) — список обновится сам, и карту
# увидят все, кто играет в веб-версию.

on:
  push:
    paths:
      - 'workshop/maps/**.json'
      - 'workshop/build_index.py'
      - '.github/workflows/workshop-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Собрать workshop/index.json
        run: python workshop/build_index.py

      - name: Закоммитить список, если он изменился
        run: |
          if git diff --quiet -- workshop/index.json; then
            echo "index.json без изменений — коммит не нужен"
            exit 0
          fi
          git config user.name "workshop-bot"
          git config user.email "workshop-bot@users.noreply.github.com"
          git add workshop/index.json
          git commit -m "Мастерская: список карт пересобран"
          git push
